{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-sm mb-4 sticky-top bg-white" style="top: 70px; z-index: 1020;">
                <div class="card-body d-flex justify-content-between align-items-center py-3">
                    <h4 class="mb-0 fw-bold text-primary">{{ course.course_name }} Exam</h4>
                    <div id="timer-box" class="bg-success text-white px-4 py-2 rounded-pill fw-bold transition-all">
                        <i class="fas fa-clock me-2"></i>Time Left: <span id="timer">--:--</span>
                    </div>
                </div>
            </div>

            <div id="proctor-container" style="position: fixed; bottom: 20px; right: 20px; width: 180px; border: 3px solid #0d6efd; border-radius: 15px; overflow: hidden; z-index: 2000; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
                <video id="video" width="180" height="135" autoplay muted style="transform: scaleX(-1); object-fit: cover;"></video>
                <div id="status-text" style="background: #0d6efd; color: white; text-align: center; font-size: 11px; padding: 4px; font-weight: bold;">
                    <i class="fas fa-video me-1"></i> INITIALIZING AI...
                </div>
            </div>

            <form id="exam-form" method="POST" action="{% url 'calculate-marks' course.id %}">
                <input type="hidden" id="course-duration" value="{{ course.duration|default:30 }}">
                {% csrf_token %}
                <input type="hidden" name="violation_count" id="violation_count_field" value="0">

                {% for q in questions %}
                <div class="card shadow-sm border-0 mb-4 rounded-3">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-4">Q{{ forloop.counter }}. {{ q.question }}</h5>
                        <hr>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="{{ q.id }}" id="q{{ q.id }}_1" value="Option1" required>
                            <label class="form-check-label" for="q{{ q.id }}_1">{{ q.option1 }}</label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="{{ q.id }}" id="q{{ q.id }}_2" value="Option2">
                            <label class="form-check-label" for="q{{ q.id }}_2">{{ q.option2 }}</label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="{{ q.id }}" id="q{{ q.id }}_3" value="Option3">
                            <label class="form-check-label" for="q{{ q.id }}_3">{{ q.option3 }}</label>
                        </div>
                        <div class="form-check mb-0">
                            <input class="form-check-input" type="radio" name="{{ q.id }}" id="q{{ q.id }}_4" value="Option4">
                            <label class="form-check-label" for="q{{ q.id }}_4">{{ q.option4 }}</label>
                        </div>
                    </div>
                    <div class="card-footer bg-light text-end py-2">
                        <small class="text-muted">Marks: {{ q.marks }}</small>
                    </div>
                </div>
                {% endfor %}

                <div class="text-center mt-5">
                    <button type="submit" class="btn btn-success btn-lg px-5 shadow rounded-pill" onclick="return confirm('Final Submission? You cannot edit after this.')">
                        Finalize & Submit Exam
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
    // --- 1. CONFIGURATION & VARIABLES ---
    const video = document.getElementById('video');
    const statusText = document.getElementById('status-text');
    const timerBox = document.getElementById('timer-box');
    const hiddenInput = document.getElementById('violation_count_field');
    const examForm = document.getElementById('exam-form');
    
    let violationCount = 0;
    const maxStrikes = 3;

    // FIX: Dynamic duration from Django Course Model
   const durationInput = document.getElementById('course-duration');
   let totalMinutes = parseInt(durationInput.value) || 30; 
   let time = totalMinutes * 60;
   
    // --- 2. TIMER LOGIC ---
    const timerElement = document.getElementById('timer');
    const countdown = setInterval(() => {
        let minutes = Math.floor(time / 60);
        let seconds = time % 60;
        
        // Critical Time Warning (Less than 5 minutes)
        if (time < 300) {
            timerBox.classList.remove('bg-success');
            timerBox.classList.add('bg-danger');
            timerBox.style.animation = "blink 1s infinite";
        }

        seconds = seconds < 10 ? '0' + seconds : seconds;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        timerElement.innerHTML = `${minutes}:${seconds}`;
        
        if (time <= 0) {
            clearInterval(countdown);
            alert("Time is up! Submitting automatically.");
            examForm.submit();
        }
        time--;
    }, 1000);

    // --- 3. VIOLATION HANDLER ---
    function handleViolation(msg) {
        violationCount++;
        hiddenInput.value = violationCount;
        alert(msg + " \nStrikes: " + violationCount + "/" + maxStrikes);
        
        if (violationCount >= maxStrikes) {
            alert("Maximum violations reached. Auto-submitting exam.");
            examForm.submit();
        }
    }

    // --- 4. PROCTORING & AI FACE DETECTION ---
    async function initAI() {
        try {
            await faceapi.nets.tinyFaceDetector.loadFromUri('https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights');
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            
            statusText.innerHTML = "AI MONITORING ACTIVE";
            statusText.style.background = "#198754"; 

            setInterval(async () => {
                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
                if (detections.length === 0) {
                    handleViolation("WARNING: Face not detected!");
                } else if (detections.length > 1) {
                    handleViolation("WARNING: Multiple people detected!");
                }
            }, 3000);

        } catch (err) {
            console.error("Camera error:", err);
            statusText.innerHTML = "CAMERA ERROR";
            statusText.style.background = "#dc3545";
        }
    }

    window.onload = initAI;

    // --- 5. BROWSER SECURITY ---
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            handleViolation("WARNING: Tab switching detected!");
        }
    });

    document.addEventListener('contextmenu', event => event.preventDefault());

    window.history.pushState(null, null, window.location.href);
    window.onpopstate = function () {
        window.history.go(1);
    };
</script>

<style>
    body { background-color: #f0f2f5; }
    .transition-all { transition: all 0.5s ease; }
    @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
    }
    .form-check-label { cursor: pointer; width: 100%; display: block; padding: 5px; border-radius: 5px; }
    .form-check-label:hover { background-color: #f8f9fa; }
</style>
{% endblock %}
