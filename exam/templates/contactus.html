{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-4 bg-primary text-white p-5 rounded-start shadow">
            <h2>Get in Touch</h2>
            <p class="mt-4"><i class="fas fa-map-marker-alt me-2"></i> CSJM University , Kanpur City</p>
            <p><i class="fas fa-phone me-2"></i> +91 6306084874</p>
            <p><i class="fas fa-envelope me-2"></i> kushwahaanuj572@gmail.com</p>
        </div>

        <div class="col-md-8 bg-white p-5 rounded-end shadow">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success">{{ message }}</div>
                {% endfor %}
            {% endif %}
            
            <form method="POST">
                {% csrf_token %}
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Your Name" required>
                    </div>
                    <div class="col">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <input type="text" name="subject" class="form-control" placeholder="Inquiry Subject" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea name="message" class="form-control" rows="5" placeholder="Write your message here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary px-4">Send Message</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
