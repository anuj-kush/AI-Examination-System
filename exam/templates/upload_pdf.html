{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-lg rounded-4 p-5 mx-auto" style="max-width: 600px;">
        <h2 class="fw-bold text-center mb-4"><i class="fas fa-file-pdf text-danger me-2"></i>PDF to Exam</h2>
        <p class="text-center text-muted">Upload a chapter or notes PDF and let AI build the test.</p>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label fw-bold">Target Course</label>
                <select name="course_id" class="form-select rounded-pill">
                    {% for c in courses %}
                        <option value="{{ c.id }}">{{ c.course_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Upload PDF File</label>
                <input type="file" name="pdf_file" class="form-control" accept=".pdf" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 rounded-pill py-2 fw-bold shadow">
                Generate Questions
            </button>
            <a href="{% url 'teacher-dashboard' %}" class="btn btn-light border w-50 rounded-pill">Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
