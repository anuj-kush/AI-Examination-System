{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg rounded-4 border-0 p-5 bg-white">
                <div class="text-center mb-4">
                    <div class="icon-box bg-primary-subtle text-primary rounded-circle d-inline-block p-3 mb-3">
                        <i class="fas fa-robot fa-3x"></i>
                    </div>
                    <h2 class="fw-bold">AI Question Lab</h2>
                    <p class="text-muted">Enter a topic and let AI draft your questions in seconds.</p>
                </div>

                <form method="POST" id="ai-form">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Select Course</label>
                        <select name="course_id" class="form-select rounded-pill">
                            {% for c in courses %}
                                <option value="{{ c.id }}">{{ c.course_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Topic (e.g. Python Loops, Indian History)</label>
                        <input type="text" name="topic" class="form-control rounded-pill" placeholder="Enter topic here..." required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">How many questions?</label>
                        <input type="number" name="num_questions" class="form-control rounded-pill" value="5" max="10">
                    </div>

                    <button type="submit" class="btn btn-gradient-primary w-100 rounded-pill py-2 fw-bold shadow mb-3" id="submit-btn">
                        <span id="btn-text"><i class="fas fa-magic me-2"></i>Generate Now</span>
                        <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>

                    <div class="text-center">
                        <a href="{% url 'teacher-dashboard' %}" class="btn-cancel-link">
                            <i class="fas fa-arrow-left me-1"></i> Cancel and Go Back
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    body { background-color: #f4f7f6; }
    .bg-primary-subtle { background-color: #e7f1ff; }
    
    /* Pretty Gradient Button */
    .btn-gradient-primary {
        background: linear-gradient(45deg, #0d6efd, #00d2ff);
        color: white;
        border: none;
        transition: 0.3s;
    }
    .btn-gradient-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4);
        color: white;
    }

    /* Elegant Centered Cancel Link */
    .btn-cancel-link {
        color: #6c757d;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition: 0.3s;
        display: inline-block;
        padding: 8px 20px;
        border-radius: 50px;
    }
    .btn-cancel-link:hover {
        color: #dc3545; /* Turns red to indicate 'Stop/Cancel' */
        background: rgba(220, 53, 69, 0.05);
    }
</style>

<script>
    const form = document.getElementById('ai-form');
    const btn = document.getElementById('submit-btn');
    const text = document.getElementById('btn-text');
    const spinner = document.getElementById('btn-spinner');

    form.onsubmit = function() {
        btn.disabled = true;
        text.innerText = "AI is Thinking...";
        spinner.classList.remove('d-none');
    };
</script>
{% endblock %}
