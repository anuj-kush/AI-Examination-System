{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-header bg-primary py-3 text-center border-0">
                    <h4 class="text-white mb-0 fw-bold">Add New Course</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Course Name</label>
                            <input type="text" name="course_name" class="form-control" placeholder="e.g. Python Programming" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Number of Questions</label>
                            <input type="number" name="question_number" class="form-control" placeholder="e.g. 10" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Total Marks</label>
                            <input type="number" name="total_marks" class="form-control" placeholder="e.g. 100" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Exam Duration (Minutes)</label>
                            <input type="number" name="duration" class="form-control" placeholder="e.g. 60" required>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill">Create Course</button>
                            <a href="{% url 'teacher-dashboard' %}" class="btn btn-outline-secondary rounded-pill">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
